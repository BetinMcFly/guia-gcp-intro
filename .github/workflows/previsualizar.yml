# Previsualizar pull request.
#
# Construye cada PR y lo publica en un canal temporal de Firebase Hosting (7 días)
# cuya URL se comenta en el propio PR. Al cerrar el PR, borra el canal en vez de
# esperar a que caduque. Los PRs desde un fork solo se construyen: GitHub no expone
# secretos a forks.
#
# Patrón de referencia: ~/proyectos/claude-code-guide/.github/workflows/previsualizar.yml

name: Previsualizar pull request

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'src/**'
      - 'content/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'tsconfig.json'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/previsualizar.yml'

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PROYECTO: claude-projects-496723

jobs:
  previsualizar:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Construir la exportación estática
        run: npm run build

      # Los secretos no se exponen a PRs desde un fork, así que el despliegue
      # fallaría. Esos PRs se quedan en el build de arriba.
      - name: Desplegar a un canal de previsualización
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ env.PROYECTO }}
          expires: 7d

      - name: Aviso para PRs desde un fork
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "PR desde un fork: se construyó el sitio pero no se generó"
          echo "previsualización, porque los secretos no se exponen a forks."

  limpiar:
    # La acción de despliegue no borra nada al cerrar el PR: no tiene entrada
    # para ello ni maneja el evento 'closed'. Hay que hacerlo con el CLI.
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # Imprescindible: el CLI de Firebase exige un firebase.json en el
      # directorio de trabajo aunque se le pase --project.
      - uses: actions/checkout@v7

      - name: Instalar el CLI de Firebase
        run: npm install -g firebase-tools@^15

      - name: Borrar el canal del PR
        env:
          # Por env y no interpolado en el script: el nombre de la rama lo
          # controla quien abre el PR, y sustituirlo dentro de `run` permitiría
          # inyectar comandos.
          RAMA: ${{ github.event.pull_request.head.ref }}
          NUMERO: ${{ github.event.pull_request.number }}
          CLAVE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          # Mismo algoritmo que usa la acción al crear el canal:
          # pr<número>-<primeros 20 caracteres de la rama>, con los
          # caracteres no admitidos sustituidos por guion bajo.
          CANAL="pr${NUMERO}-$(printf '%s' "${RAMA:0:20}" | sed 's/[^a-zA-Z0-9_.-]/_/g')"
          echo "Canal a borrar: $CANAL"

          F="$(mktemp -d)/sa.json"
          printf '%s' "$CLAVE" > "$F"
          export GOOGLE_APPLICATION_CREDENTIALS="$F"

          SALIDA=$(mktemp)
          firebase hosting:channel:delete "$CANAL" --force --project "$PROYECTO" >"$SALIDA" 2>&1
          CODIGO=$?
          cat "$SALIDA"

          shred -u "$F" 2>/dev/null || rm -f "$F"

          if [ "$CODIGO" -eq 0 ]; then
            echo "Canal $CANAL borrado."
            exit 0
          fi

          # Un canal inexistente es normal: el PR pudo cerrarse antes de que
          # llegara a desplegarse. Cualquier otro fallo sí debe romper el job;
          # tragárselo dejaría canales vivos sin que nadie se entere.
          if grep -qiE "not find|does not exist|404" "$SALIDA"; then
            echo "El canal $CANAL no existía. Nada que borrar."
            exit 0
          fi

          echo "::error::No se pudo borrar el canal $CANAL (código $CODIGO)."
          exit "$CODIGO"
